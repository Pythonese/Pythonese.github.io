<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You have a secret</title>
<style>
/* Light Theme CSS for Steganography Tool */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
    min-height: 100vh;
    padding: 2rem;
    color: #1e293b;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 1.75rem;
}

/* Group Cards */
.group {
    background: #ffffff;
    border-radius: 1.25rem;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
    padding: 1.5rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid rgba(203, 213, 225, 0.5);
}

.group:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 28px rgba(0, 0, 0, 0.08);
}

.group > div:first-child {
    font-weight: 600;
    font-size: 1.2rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid #e2e8f0;
    color: #0f172a;
    letter-spacing: -0.01em;
}

/* Textareas */
textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.75rem;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    resize: vertical;
    background-color: #fefefe;
    transition: all 0.2s ease;
    color: #0f172a;
}

textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    background-color: #ffffff;
}

textarea::placeholder {
    color: #94a3b8;
    font-weight: 400;
}

/* Length indicator */
#view-length1, #view-length2, #view-length3, #view-length4 {
    font-size: 0.75rem;
    color: #475569;
    margin-top: -0.25rem;
    margin-bottom: 0.75rem;
    font-family: monospace;
    background: #f1f5f9;
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
}

/* Button Row */
.btn-row {
    display: flex;
    gap: 0.75rem;
    margin: 0.5rem 0 0.75rem 0;
}

.btn-row button {
    flex: 1;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    padding: 0.6rem 0;
    border-radius: 2rem;
    font-weight: 500;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #1e293b;
    letter-spacing: 0.3px;
}

.btn-row button:hover {
    background: #eef2ff;
    border-color: #3b82f6;
    color: #1e40af;
    transform: scale(0.98);
}

.btn-row button:active {
    background: #e0e7ff;
}

/* View area */
.view-area {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 0.75rem;
    padding: 0.9rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.8rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 120px;
    overflow-y: auto;
    margin: 0.5rem 0;
    color: #0f172a;
    background-color: #fefce8;
    border-left: 3px solid #94a3b8;
}

/* Copy button */
.group > button:last-child {
    width: 100%;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    padding: 0.5rem;
    border-radius: 2rem;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    color: #334155;
    margin-top: 0.25rem;
}

.group > button:last-child:hover {
    background: #eef2ff;
    border-color: #3b82f6;
    color: #1e40af;
}

/* Special styling for the first group's length display */
#view-length1, #view-length2, #view-length3, #view-length4 {
    font-family: monospace;
}

/* Scrollbar styling */
textarea::-webkit-scrollbar, .view-area::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

textarea::-webkit-scrollbar-track, .view-area::-webkit-scrollbar-track {
    background: #e2e8f0;
    border-radius: 10px;
}

textarea::-webkit-scrollbar-thumb, .view-area::-webkit-scrollbar-thumb {
    background: #94a3b8;
    border-radius: 10px;
}

/* Responsive adjustments */
@media (max-width: 860px) {
    body {
        padding: 1rem;
    }

    .container {
        gap: 1rem;
    }

    .group {
        padding: 1.2rem;
    }
}

/* For better readability inside textareas */
textarea[placeholder*="Enter secret"] {
    font-family: monospace;
}

/* Additional light accents */
.group .btn-row button:first-child {
    background: #eff6ff;
    border-color: #bfdbfe;
}

.group .btn-row button:first-child:hover {
    background: #dbeafe;
}

.group .btn-row button:last-child {
    background: #f1f5f9;
}

.group .btn-row button:last-child:hover {
    background: #e2e8f0;
}

/* Distinguish view areas based on content */
.view-area:empty::before {
    content: "— no output —";
    color: #94a3b8;
    font-style: italic;
}
</style>
</head>
<body>

<div class="container">
    <!-- Group 1 -->
    <div class="group">
        <div>Text message</div>
        <textarea id='key1' placeholder="Enter key..."></textarea>
        <textarea id='secret1' placeholder="Enter secret or length..." oninput="document.getElementById('view-length1').textContent = 'secret length: ' + new TextEncoder().encode(document.getElementById('secret1').value).length"></textarea>
        <div id="view-length1">secret length: </div>
        <textarea id='container1' placeholder="Enter container..."></textarea>
        <div class="btn-row">
            <button onclick="document.getElementById('view1').textContent = regularTextStegoPack(
                document.getElementById('container1').value,
                new TextEncoder().encode(document.getElementById('secret1').value),
                +document.getElementById('key1').value,
            )">Pack</button>
            <button onclick="document.getElementById('view1').textContent = new TextDecoder().decode(regularTextStegoUnpack(
                document.getElementById('container1').value,
                +document.getElementById('secret1').value,
                +document.getElementById('key1').value,
            ))">Unpack</button>
        </div>
        <div class="view-area" id="view1">View 1</div>
        <button onclick="copyText(1)">Copy</button>
    </div>

    <!-- Group 2 -->
    <div class="group">
        <div>JS</div>
        <textarea id='key2' placeholder="Enter key..."></textarea>
        <textarea id='secret2' placeholder="Enter secret or length..."></textarea>
        <div id="view-length2">secret length: </div>
        <textarea id='container2' placeholder="Enter container..."></textarea>
        <div class="btn-row">
            <button>Pack</button>
            <button>Unpack</button>
        </div>
        <div class="view-area" id="view2">View 2</div>
        <button onclick="copyText(2)">Copy</button>
    </div>

    <!-- Group 3 -->
    <div class="group">
        <div>JSON</div>
        <textarea id='key3' placeholder="Enter key..."></textarea>
        <textarea id='secret3' placeholder="Enter secret or length..."></textarea>
        <div id="view-length3">secret length: </div>
        <textarea id='container3' placeholder="Enter container..."></textarea>
        <div class="btn-row">
            <button>Pack</button>
            <button>Unpack</button>
        </div>
        <div class="view-area" id="view3">View 3</div>
        <button onclick="copyText(3)">Copy</button>
    </div>

    <!-- Group 4 -->
    <div class="group">
        <div>CSS</div>
        <textarea id='key4' placeholder="Enter key..."></textarea>
        <textarea id='secret4' placeholder="Enter secret or length..."></textarea>
        <div id="view-length4">secret length: </div>
        <textarea id='container4' placeholder="Enter container..."></textarea>
        <div class="btn-row">
            <button>Pack</button>
            <button>Unpack</button>
        </div>
        <div class="view-area" id="view4">View 4</div>
        <button onclick="copyText(4)">Copy</button>
    </div>
</div>

<script src="module.js"></script>

</body>
</html>
